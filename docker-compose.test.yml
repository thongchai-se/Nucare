services:
  db-test:
    image: postgres:15-alpine
    container_name: nucare-db-test
    environment:
      POSTGRES_DB: nucare_test
      POSTGRES_USER: nucare
      POSTGRES_PASSWORD: nucare_test_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nucare -d nucare_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_test_data:
